[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opnsense-guard-mcp"
version = "0.0.1"
description = "Safety-first MCP server for OPNsense: read-only by default, planned + audited + auto-reverting writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "D3lta Security" }]
keywords = ["opnsense", "mcp", "firewall", "model-context-protocol", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
opnsense-guard-mcp = "opnsense_guard.server:main"

[project.urls]
Homepage = "https://github.com/d3ltasecurity/opnsense-guard-mcp"
Issues = "https://github.com/d3ltasecurity/opnsense-guard-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opnsense_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106"]  # fake credentials and bind addresses in tests

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
